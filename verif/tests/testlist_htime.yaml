# Testlist for the hidden-time extension.
# Run on cv64a6_imafdch_sv39_htime; *-off tests run on cv64a6_imafdch_sv39.

testlist:
  - test: rv64h-p-htime-time-mtime
    iterations: 1
    path_var: TESTS_PATH
    gcc_opts: "-static -mcmodel=medany -fvisibility=hidden -nostdlib -nostartfiles -I<path_var>/riscv-tests/isa/macros/scalar/ -I<path_var>/riscv-tests/env/p/ -I<path_var>/riscv-tests/riscv-target/spike/"
    asm_tests: <path_var>/custom/htime/time_mtime.S

  - test: rv64h-p-htime-time-counteren
    iterations: 1
    path_var: TESTS_PATH
    gcc_opts: "-static -mcmodel=medany -fvisibility=hidden -nostdlib -nostartfiles -I<path_var>/riscv-tests/isa/macros/scalar/ -I<path_var>/riscv-tests/env/p/ -I<path_var>/riscv-tests/riscv-target/spike/"
    asm_tests: <path_var>/custom/htime/time_counteren.S

