    asm_tests: <path_var>/custom/htime/htime_introspect.S

  # Hidden freeze. Checked by the testbench freeze monitor (cva6_freeze_monitor.sv), which checks
  # all structures by default: sim_args +freeze_mon_expect is the expected sequence of windows, each
  # as its end reason followed by +<what> for each allowed change. htime.sh passes sim_args.
  - test: rv64h-p-htime-freeze-window
    iterations: 1
    path_var: TESTS_PATH
    gcc_opts: "-static -mcmodel=medany -fvisibility=hidden -nostdlib -nostartfiles -I<path_var>/riscv-tests/isa/macros/scalar/ -I<path_var>/riscv-tests/env/p/ -I<path_var>/riscv-tests/riscv-target/spike/"
    asm_tests: <path_var>/custom/htime/freeze_window.S
    sim_args: "+freeze_mon_expect=xret,xret,hfrz0,xret,xret,hfrz0,xret,xret,hfrz0,xret,hfrz0,hfrz0"

  - test: rv64h-p-htime-freeze-dcache
    iterations: 1
    path_var: TESTS_PATH
    gcc_opts: "-static -mcmodel=medany -fvisibility=hidden -nostdlib -nostartfiles -I<path_var>/riscv-tests/isa/macros/scalar/ -I<path_var>/riscv-tests/env/p/ -I<path_var>/riscv-tests/riscv-target/spike/"
    asm_tests: <path_var>/custom/htime/freeze_dcache.S
    sim_args: "+freeze_mon_expect=xret+dcache-amo-inv,hfrz0"

  - test: rv64h-p-htime-freeze-icache
